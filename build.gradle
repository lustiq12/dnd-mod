plugins {
    id 'eclipse'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = '1.0'
base.archivesName = "dnd"

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// Curios Repository
repositories {
    maven {
        url = "https://www.cursemaven.com"
    }
}

//  Curios Dependencies
dependencies {
    implementation "curse.maven:curios-309927:7642207"
}

neoForge {
    version = "21.8.31"

    parchment {
        mappingsVersion = '2025.09.14'
        minecraftVersion = '1.21.8'
    }

    runs {
        client {
            client()

            def mcreatorJvmOptions = System.getenv('MCREATOR_JVM_OPTIONS')
            if (mcreatorJvmOptions) {
                mcreatorJvmOptions.split("\\s+").findAll { it.trim() }.each { arg ->
                    jvmArgument(arg)
                }
            }
        }
        server {
            server()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        mcreator {
            sourceSet sourceSets.main
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

apply from: 'mcreator.gradle'